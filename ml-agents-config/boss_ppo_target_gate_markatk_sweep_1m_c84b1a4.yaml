# 1,000,000-step PPO long-run reproduction from stable commit c84b1a4.
# PURPOSE: test whether enough timesteps let PPO-only clear the boss (a friend
# reportedly cleared at ~1M on this same code). This is NOT a new reward experiment.
#
# Identical game/reward/observation/action to c84b1a4:
#   - VectorObservationSize 438, Action Spec MultiDiscrete [5,2]
#   - hit-gated reward (SuccessfulHitBonusReward), WarningTilePenalty -0.10 (original)
#   - Target Gate + MarkATK obs + Phase2 sweep history
#   - NO stationary lever, NO warn-tile relax, NO demo/BC
# Hyperparameters/network are the same as the c84b1a4 50K stable config; only
# max_steps / summary_freq / checkpoint_interval / keep_checkpoints are long-run tuned.
behaviors:
  BossPlayer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 12
    checkpoint_interval: 100000
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
